name: checks

on:
  push:
  pull_request:

jobs:
  run-sh:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the asserted probe suite (no dependencies)
        run: sh run.sh
      - name: Check the server module imports and self-check passes
        run: |
          python - <<'PY'
          import runpy, sys
          sys.argv = ["app.py"]
          import importlib.util
          spec = importlib.util.spec_from_file_location("app", "server/app.py")
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          hc = app.selfcheck()
          assert hc["matches_runsh_no4"], hc
          print("self-check OK:", hc["verdict"], hc["fit_at"], hc["grok_at"])
          PY
